blocks:
- uuid: load_iris
  type: data_loader
  language: python
  upstream_blocks: []
  downstream_blocks:
  - prepare_data
  file_path: data_loaders/load_iris.py

- uuid: prepare_data
  type: transformer
  language: python
  upstream_blocks:
  - load_iris
  downstream_blocks:
  - train_model
  file_path: transformers/prepare_data.py

- uuid: train_model
  type: transformer
  language: python
  upstream_blocks:
  - prepare_data
  downstream_blocks:
  - save_results
  - evaluate_model
  file_path: transformers/train_model.py

- uuid: save_results
  type: data_exporter
  language: python
  upstream_blocks:
  - train_model
  downstream_blocks: []
  file_path: data_exporters/save_results.py

- uuid: evaluate_model
  type: transformer
  language: python
  upstream_blocks:
  - train_model
  downstream_blocks:
  - save_metrics
  file_path: transformers/evaluate_model.py

- uuid: save_metrics
  type: data_exporter
  language: python
  upstream_blocks:
  - evaluate_model
  downstream_blocks: []
  file_path: data_exporters/save_metrics.py

name: iris_classifier
